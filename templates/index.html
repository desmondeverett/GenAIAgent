<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenAI Agent Dashboard</title>
    <!-- Linked dedicated green stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <span>🌿</span> Genie AI Agent Dashboard
        </div>
        
        <div class="chat-messages" id="chatBox">
            <div class="message bot-message">
                Hello! What's your name and how can I help you today?
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ask your agent anything...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const message = inputField.value.trim();

            if (!message) return;

            # Append User Message to UI
            chatBox.innerHTML += `<div class="message user-message">${message}</div>`;
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();

                # Append Agent Reply to UI
                chatBox.innerHTML += `<div class="message bot-message">${data.response}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                chatBox.innerHTML += `<div class="message bot-message" style="color: red;">Error connecting to backend server.</div>`;
            }
        }

        # Allow Enter key to trigger send
        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
