<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenAI Agent Workspace</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; text-align: center; }
        .chat-box { height: 400px; border: 1px solid #ddd; border-radius: 4px; padding: 10px; overflow-y: scroll; margin-bottom: 15px; background: #fafafa; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 6px; max-width: 80%; }
        .user-message { background: #007bff; color: white; margin-left: auto; text-align: right; }
        .agent-message { background: #e9ecef; color: #333; margin-right: auto; }
        .input-group { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; outline: none; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>Genie AI Agent Dashboard</h2>
    <div class="chat-box" id="chatBox">
        <div class="message agent-message">Hello! What's your name and how can I help you today?</div>
    </div>
    <div class="input-group">
        <input type="text" id="userInput" placeholder="Ask your agent anything..." autocomplete="off">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const messageText = inputField.value.trim();
        
        if (!messageText) return;

        // Append User Message to UI
        chatBox.innerHTML += `<div class="message user-message">${messageText}</div>`;
        inputField.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // Send request to Flask backend endpoint (/api/chat)
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: messageText })
            });

            const data = await response.json();

            // Append Agent Reply to UI
            chatBox.innerHTML += `<div class="message agent-message">${data.response}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (error) {
            chatBox.innerHTML += `<div class="message agent-message" style="color:red;">Error connecting to backend server.</div>`;
        }
    }

    // Allow Enter key to trigger send
    document.getElementById('userInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
</script>

</body>
</html>
